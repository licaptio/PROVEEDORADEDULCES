<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROVSOFT Recordatorios</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b80000'/%3E%3Cpath d='M20 18h24v28H20z' fill='white'/%3E%3Cpath d='M25 25h14M25 32h14M25 39h9' stroke='%23b80000' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">PROVSOFT</p><h1>Recordatorios</h1></div>
    <div id="estadoConexion" class="connection">Conectando...</div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header"><div><p class="step">NUEVO RECORDATORIO</p><h2>Programar alarma</h2></div></div>

      <form id="formRecordatorio" novalidate>
        <div class="grid-two">
          <label class="field"><span>Fecha de alarma</span><input type="date" id="fecha" required></label>
          <label class="field"><span>Hora de alarma</span><input type="time" id="hora" required></label>
        </div>

        <div class="capture-grid">
          <section>
            <span class="field-label">Imágenes opcionales</span>
            <div id="zonaImagenes" class="drop-zone" tabindex="0">
              <div class="drop-icon">📋</div>
              <strong>Pega con Ctrl + V</strong>
              <span>Arrastra imágenes aquí</span>
              <button type="button" id="btnSeleccionar" class="btn ghost small">Seleccionar imágenes</button>
              <input type="file" id="selectorImagenes" accept="image/*" multiple hidden>
            </div>
            <div id="previsualizaciones" class="preview-grid"></div>
          </section>

          <label class="field message-field">
            <span>Mensaje opcional</span>
            <textarea id="contenido" placeholder="Pega aquí WhatsApp, correo, nota o cualquier información."></textarea>
          </label>
        </div>

        <div class="actions">
          <button type="button" id="btnLimpiar" class="btn secondary">Limpiar</button>
          <button type="submit" id="btnGuardar" class="btn primary">Guardar recordatorio</button>
        </div>
      </form>
      <div id="mensajeSistema" class="system-message" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div><p class="step">REGISTROS</p><h2>Últimos recordatorios</h2></div>
        <button id="btnRecargar" class="btn ghost" type="button">Recargar</button>
      </div>
      <div id="resumen" class="summary"></div>
      <div id="listaRecordatorios" class="reminder-list"><div class="empty">Cargando recordatorios...</div></div>
    </section>
  </main>

  <div id="editorModal" class="modal editor-modal" hidden>
    <section class="modal-card editor-card" role="dialog" aria-modal="true" aria-labelledby="editorTitulo">
      <header class="modal-header">
        <div>
          <p class="step">EDITAR RECORDATORIO</p>
          <h2 id="editorTitulo">Recordatorio</h2>
        </div>
        <button id="cerrarEditor" class="modal-close" type="button" aria-label="Cerrar">×</button>
      </header>

      <form id="formEditor" class="editor-body" novalidate>
        <input type="hidden" id="editorId">

        <div class="grid-two editor-date-grid">
          <label class="field"><span>Fecha de alarma</span><input type="date" id="editorFecha" required></label>
          <label class="field"><span>Hora de alarma</span><input type="time" id="editorHora" required></label>
        </div>

        <div class="capture-grid editor-capture-grid">
          <section>
            <span class="field-label">Imágenes</span>
            <div id="editorZonaImagenes" class="drop-zone" tabindex="0">
              <div class="drop-icon">📋</div>
              <strong>Pega con Ctrl + V</strong>
              <span>Arrastra o agrega imágenes</span>
              <button type="button" id="editorBtnSeleccionar" class="btn ghost small">Agregar imágenes</button>
              <input type="file" id="editorSelectorImagenes" accept="image/*" multiple hidden>
            </div>
            <div id="editorPrevisualizaciones" class="preview-grid editor-preview-grid"></div>
          </section>

          <label class="field message-field editor-message-field">
            <span>Mensaje</span>
            <textarea id="editorContenido" placeholder="Mensaje del recordatorio"></textarea>
          </label>
        </div>

        <div id="editorMensaje" class="system-message" aria-live="polite"></div>

        <footer class="editor-actions">
          <button type="button" id="btnAtendido" class="btn success">Marcar atendido</button>
          <div class="editor-actions-right">
            <button type="button" id="btnCancelarEdicion" class="btn secondary">Cancelar</button>
            <button type="submit" id="btnGuardarEdicion" class="btn primary">Guardar cambios</button>
          </div>
        </footer>
      </form>
    </section>
  </div>

  <div id="visor" class="viewer" hidden>
    <button id="cerrarVisor" class="viewer-close" type="button">×</button>
    <img id="imagenVisor" alt="Imagen del recordatorio">
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

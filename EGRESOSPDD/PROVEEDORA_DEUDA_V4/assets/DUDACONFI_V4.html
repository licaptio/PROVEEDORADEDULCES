<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b80f1c" />
  <title>PROVSOFT - Deuda Íntegra</title>

  <link rel="icon" href="./img/logo-proveedora.jfif" type="image/jpeg" />
  <link rel="stylesheet" href="./css/desktop.css" media="(min-width: 769px)" />
  <link rel="stylesheet" href="./css/mobile.css" media="(max-width: 768px)" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar compact-bar">
      <div class="brand">
        <img class="brand-logo" src="./img/logo-proveedora.jfif" alt="Proveedora de Dulces y Desechables" />
        <div class="brand-copy">
          <span class="eyebrow">PROVSOFT · DEUDA ÍNTEGRA</span>
          <div id="totalGlobal" class="summary-total">$0.00</div>
        </div>
      </div>

      <div class="summary-meta">
        <span id="invoiceCount">0 facturas</span>
        <span id="syncStatus" class="sync-pill"><i></i> Conectando…</span>
      </div>

      <div class="menu-wrap">
        <button id="menuButton" class="icon-button" type="button" aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false">⋮</button>
        <div id="mainMenu" class="dropdown hidden" role="menu">
          <button type="button" role="menuitem" id="excelButton"><span>▣</span> Generar Excel</button>
          <button type="button" role="menuitem" id="configButton"><span>⚙</span> Configuración</button>
        </div>
      </div>
    </header>

    <section class="content-card compact-content">
      <p id="orderLabel" class="visually-hidden">Orden: RFC</p>
      <div id="debtView" class="debt-view"></div>
    </section>
  </main>

  <div id="configModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="configTitle">
    <section class="modal-card">
      <header class="modal-header">
        <div>
          <span class="modal-kicker">CONFIGURACIÓN</span>
          <h2 id="configTitle">Orden de la deuda</h2>
        </div>
        <button id="closeModalButton" class="close-button" type="button" aria-label="Cerrar">×</button>
      </header>

      <div class="modal-body">
        <p class="modal-help">Selecciona cómo quieres ver la deuda. El mismo orden se conserva al generar el Excel.</p>

        <label class="order-option">
          <input type="radio" name="debtOrder" value="rfc" />
          <span class="order-radio"></span>
          <span><strong>RFC</strong><small>RFC ascendente; dentro de cada RFC, factura más antigua primero.</small></span>
        </label>

        <label class="order-option">
          <input type="radio" name="debtOrder" value="nombre" />
          <span class="order-radio"></span>
          <span><strong>Nombre</strong><small>Proveedor por nombre; dentro de cada proveedor, factura más antigua primero.</small></span>
        </label>

        <label class="order-option">
          <input type="radio" name="debtOrder" value="fecha_antigua" />
          <span class="order-radio"></span>
          <span><strong>Fecha más antigua</strong><small>Mezcla todos los proveedores y pone primero la factura más vieja de toda la deuda.</small></span>
        </label>

        <label class="order-option featured">
          <input type="radio" name="debtOrder" value="proveedor_deuda_antigua" />
          <span class="order-radio"></span>
          <span><strong>Proveedor completo con deuda más antigua</strong><small>Localiza la factura más vieja, muestra toda la deuda de ese proveedor junta y luego continúa con el siguiente proveedor más antiguo.</small></span>
        </label>
      </div>

      <footer class="modal-footer">
        <button id="cancelModalButton" class="button secondary" type="button">Cancelar</button>
        <button id="saveOrderButton" class="button primary" type="button">Guardar orden</button>
      </footer>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
